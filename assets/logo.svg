<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="cwBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C39E"/>
      <stop offset="45%" stop-color="#C9843F"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
  </defs>

  <!-- Bronze C ring icon -->
  <g transform="translate(8, 5)">
    <!-- Outer bronze ring (open C shape) -->
    <path d="M 38 10 A 30 30 0 1 0 38 70" stroke="url(#cwBronze)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- Inner dot/circle -->
    <circle cx="28" cy="40" r="6" fill="#1A1410"/>
    <!-- Small cursor pointer shape inside -->
    <circle cx="28" cy="40" r="3" fill="#C9843F"/>
  </g>

  <!-- W checkmark / tick shape -->
  <g transform="translate(55, 8)">
    <!-- Left stroke of W going down -->
    <polyline points="0,12 12,52 24,24 36,52 48,4" stroke="#1A1410" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- CrystalWeb text -->
  <text x="118" y="52" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="34" fill="#1A1410" letter-spacing="-0.5">CrystalWeb</text>

  <!-- DIGITAL AGENCY subtext -->
  <text x="120" y="70" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#C9843F" letter-spacing="3">DIGITAL AGENCY</text>
</svg>
